<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyFlow - Smart Student Study Planner for JAMB, WAEC & Exams</title>
    <meta name="description" content="Turn your exam goals into a personalized daily study plan. Automated study scheduling, weak-topic optimization, and score tracking for JAMB, WAEC, NECO, and university exams." />
    <meta property="og:title" content="StudyFlow - Turn Your Exam Goals Into a Daily Study Plan" />
    <meta property="og:description" content="Personalized timetable generator and weak-topic optimizer for secondary-school and university students." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('studyflow_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-neutral-50 text-neutral-900 antialiased font-sans dark:bg-neutral-950 dark:text-neutral-100 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
